name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect project type
        id: d
        run: |
          if [ -f pubspec.yaml ]; then echo "type=flutter" >> $GITHUB_OUTPUT
          elif [ -f gradlew ]; then echo "type=gradle" >> $GITHUB_OUTPUT
          elif [ -f android/gradlew ]; then echo "type=node" >> $GITHUB_OUTPUT
          else echo "type=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Flutter build
        if: steps.d.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - if: steps.d.outputs.type == 'flutter'
        run: |
          flutter pub get
          flutter build apk --release

      - name: Android (Gradle) build
        if: steps.d.outputs.type == 'gradle'
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: React Native / Capacitor build
        if: steps.d.outputs.type == 'node'
        run: |
          npm install
          npm run build --if-present
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: '**/*.apk'
